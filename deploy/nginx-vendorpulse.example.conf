# VendorPulse — example Nginx site config
# Copy/adapt on the production server (e.g. /etc/nginx/sites-available/vendorpulse).
#
# Routing rules (order matters — put /web_dashboard/ BEFORE /):
#   /web_dashboard/*  → Next.js frontend container (FRONTEND_PORT, default 3001)
#   /api/*, /, /up    → Laravel app container (APP_PORT, default 8001)
#
# Without this, https://your-domain/ returns 404 from Next.js and the public
# DNS landing page (Laravel Blade at routes/web.php) never appears.

server {
    listen 80;
    listen [::]:80;
    server_name vendorpulse.veravalonline.com;

    # TLS termination is usually handled by certbot / a separate ssl server block.

    client_max_body_size 32m;

    # Next.js dashboard (basePath /web_dashboard)
    location /web_dashboard/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel: public landing (/), API (/api/*), health (/up)
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
