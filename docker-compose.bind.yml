# Live code inside Docker: bind-mounts this directory into `app`, `horizon`, and `scheduler`.
#
# Use with the base stack:
#   docker compose -f docker-compose.yml -f docker-compose.bind.yml up -d
#
# macOS: Docker Desktop → Settings → Resources → File sharing → add a parent of
# this project (e.g. /Applications/XAMPP or the full path), Apply & Restart.
#
# After enabling the mount, install PHP deps inside the app container if needed:
#   docker compose -f docker-compose.yml -f docker-compose.bind.yml exec app composer install

services:
  app:
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env:ro

  horizon:
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env:ro

  scheduler:
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env:ro

  # Pass production env vars as build args so Next.js bakes them in at build time.
  # These are read from the host .env file (or shell env) by docker compose.
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://vendorpulse.veravalonline.com/api/v1}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-https://vendorpulse.veravalonline.com}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
